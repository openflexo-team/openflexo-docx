dependencies {
  // openflexo dep
  implementation flexoFoundation()
  api flexoDocumentation()
  // external dep
  api 'org.docx4j:docx4j:6.1.2'
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api:2.3.3'
  implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.3'
  
  // testing dep
  testImplementation flexoFoundationTest()

  // Test resource center
  testRuntimeOnly project(':docx-ta-test-rc')
}
